name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar dependencias do sistema
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev \
            libssl-dev automake

      - name: Instalar Buildozer e Cython
        run: |
          pip3 install --upgrade pip
          pip3 install --upgrade Cython==0.29.33 buildozer

      - name: Compilar o APK
        run: |
          yes | buildozer -v android debug

      - name: Disponibilizar o APK para download
        uses: actions/upload-artifact@v4
        with:
          name: sistemacomercial-apk
          path: bin/*.apk
