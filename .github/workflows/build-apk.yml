name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Compilar o APK com Buildozer via Docker
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/home/user/hostcwd" \
            kivy/buildozer:latest android debug

      - name: Disponibilizar o APK para download
        uses: actions/upload-artifact@v4
        with:
          name: sistemacomercial-apk
          path: bin/*.apk
